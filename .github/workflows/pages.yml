name: Publier la documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Installer les dépendances
        run: pip install -r requirements-docs.txt

      - name: Construire le site
        run: mkdocs build --strict

      - name: Publier les données ouvertes et les classeurs avec le site
        run: |
          cp -r data site/data
          cp *.xlsx site/
          cp CITATION.cff CONTRIBUTING.md CONTRIBUTORS.md llms.txt site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
